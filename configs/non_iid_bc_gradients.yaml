# Frozen supplementary experiment for Cases B and C1.
#
# The proxy-quality branch studies a generated subject context. It is
# diagnostic rather than a universal calibration claim: the proxy is formed
# from auxiliary measurements independent of the test-period innovations.
# The power branch uses the scientifically complete conditioning set.

stage:
  label: "Frozen Case-B proxy-quality and B/C1 local-power experiment."

simulation:
  subjects: 250
  visits_b: 4
  visits_c: 8
  burn_in_c: 50
  subject_folds: 5
  alpha: 0.05
  seed: 20260824
  workers: 4
  proxy_repetitions: 1000
  power_repetitions: 500
  proxy_measurements: [4, 20, 100, 500, 2000]
  power_coefficients: [0.05, 0.10, 0.20, 0.30]

output:
  directory: results/non_iid_bc_gradients
