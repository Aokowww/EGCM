# Formal gate component 2a: primary Design A under the core A-null.
# Run in restartable 100-task batches until 1000/1000 checkpoints complete.

stage:
  label: "Formal gate component 2a: core Design A null calibration."

simulation:
  regimes: [A_null]
  designs: [A]
  repetitions: 1000
  subjects: 120
  visits_regular: 4
  visits_sparse_min: 2
  visits_sparse_max: 5
  random_effect_sd: 1
  random_effect_correlation: 0.7
  alternative_error_coefficient: 0.45
  subject_folds: 5
  visit_folds: 2
  design_b_min_visits: 3
  bootstrap_reps: 999
  alpha: 0.05
  seed: 20260726
  workers: 4
  max_tasks_per_run: 100

gate:
  minimum_repetitions: 1000
  max_exact_95_high: 0.075

output:
  directory: results/adni_simulation_stage2a_core_a_null
