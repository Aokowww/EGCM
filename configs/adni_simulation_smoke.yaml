# Fast software/calibration smoke test. This is not the formal Monte Carlo run.
simulation:
  repetitions: 4
  subjects: 60
  visits_regular: 4
  visits_sparse_min: 2
  visits_sparse_max: 5
  random_effect_sd: 1
  random_effect_correlation: 0.7
  alternative_error_coefficient: 0.45
  subject_folds: 5
  visit_folds: 2
  design_b_min_visits: 3
  bootstrap_reps: 199
  alpha: 0.05
  seed: 20260726

output:
  directory: results/adni_simulation_smoke
