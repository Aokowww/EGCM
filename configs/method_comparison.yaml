# Frozen comparison for the A1 many-subject regime.  The nuisance model is
# intentionally simple and correctly specified so that the comparison isolates
# the inferential unit: independent subjects versus correlated visits.

stage:
  label: "Frozen A1 inferential-unit comparison"

simulation:
  repetitions_null: 1000
  repetitions_power: 500
  subjects: 250
  visits: 6
  subject_folds: 5
  alpha: 0.05
  seed: 20260824
  workers: 4
  ar1: 0.55
  random_intercept_sd: 0.75
  random_slope_sd_base: 0.00
  random_slope_sd_stress: 0.30
  alternative_coefficients: [0.05, 0.10, 0.20, 0.30]

gate:
  minimum_null_repetitions: 1000
  maximum_exact_95_high: 0.075
  primary_method: "subject-score GCM"

output:
  directory: "results/method_comparison"
